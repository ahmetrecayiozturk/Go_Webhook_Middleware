worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # Nginx sürüm numarasını response header'larında gizle (güvenlik)
    server_tokens off;

    # Go servisine giden bağlantıları havuzda (Keep-Alive) tut -> yüksek RPS performansı
    upstream webhook_backend {
        server app:8080;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Go tarafındaki 1MB MaxBytesReader limitini daha kapıdayken uygula
        client_max_body_size 1m;

        # ---------------------------------------------------------
        # 1. /metrics ERİŞİM KISITLAMASI (Dış dünyaya tamamen kapalı)
        # ---------------------------------------------------------
        location ^~ /metrics {
            deny all;
            return 403;
        }

        # ---------------------------------------------------------
        # 2. WEBHOOK VE API ENDPOINTLERİ
        # ---------------------------------------------------------
        location / {
            proxy_pass http://webhook_backend;

            # Keep-Alive için HTTP/1.1 zorunludur
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # IP SPOOFING KORUMASI:
            # İstemci sahte X-Real-IP gönderse bile $remote_addr ile ezilir.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Go tarafındaki ReadTimeout (5s) / WriteTimeout (10s) ile uyumlu süreler
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;
        }
    }
}